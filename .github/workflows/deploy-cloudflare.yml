name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    # Run only in the source repository after configuring its Cloudflare secrets.
    if: github.repository == 'covagashi/eplan-cloudflare-rags'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-rag-eplan-p8/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
